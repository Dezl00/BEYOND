name: Windows Flutter
on:
  push:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/windows.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: beyond-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Flutter SDK
        working-directory: ${{ runner.temp }}
        run: |
          Invoke-WebRequest -Uri 'https://storage.googleapis.com/flutter_infra_release/releases/stable/windows/flutter_windows_3.47.8-stable.zip' -OutFile flutter.zip
          if ((Get-FileHash flutter.zip -Algorithm SHA256).Hash.ToLower() -ne '11e19ea3409808fe3b3765ea8149640c299e58cce6eda7c9f38fc1b4a193eb6e') { throw 'SDK checksum mismatch' }
          tar -xf flutter.zip
          "${env:RUNNER_TEMP}/flutter/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Prepare unconfigured runtime
        run: Copy-Item assets/runtime.example.json assets/runtime.json
      - run: flutter config --no-analytics
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --no-pub --fatal-infos
      - run: flutter test --no-pub
      - run: flutter build windows --release --no-pub
      - name: Bundle Microsoft runtime
        run: |
          $vs = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -property installationPath
          $crt = Get-ChildItem "$vs/VC/Redist/MSVC/*/x64/Microsoft.VC143.CRT" -Directory | Sort-Object FullName | Select-Object -Last 1
          if (-not $crt) { throw 'Microsoft C++ runtime missing' }
          Copy-Item "$($crt.FullName)/*.dll" build/windows/x64/runner/Release/
      - uses: actions/upload-artifact@v4
        with:
          name: Beyond-Windows-x64
          path: desktop/build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 14
