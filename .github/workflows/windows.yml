name: Windows Flutter
on:
  push:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/windows.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: beyond-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Flutter SDK
        working-directory: ${{ runner.temp }}
        run: |
          Invoke-WebRequest -Uri 'https://storage.googleapis.com/flutter_infra_release/releases/stable/windows/flutter_windows_3.44.9-stable.zip' -OutFile flutter.zip
          if ((Get-FileHash flutter.zip -Algorithm SHA256).Hash.ToLower() -ne '8ef1107d226654736755bc51b969d6bd46787ff0241650f942e774fb0ca7d0ac') { throw 'SDK checksum mismatch' }
          tar -xf flutter.zip
          "${env:RUNNER_TEMP}/flutter/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Prepare unconfigured runtime
        run: Copy-Item assets/runtime.example.json assets/runtime.json
      - run: flutter config --no-analytics
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --no-pub --fatal-infos
      - run: flutter test --no-pub
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Beyond-UI-previews
          path: desktop/work/*.png
          if-no-files-found: ignore
          retention-days: 7
      - run: flutter build windows --release --no-pub
      - name: Test native feeder transfers
        run: |
          & build/windows/x64/scanner-tests/Release/scanner_transfer_tests.exe
          if ($LASTEXITCODE -ne 0) { throw 'Native scanner transfer tests failed' }
      - name: Bundle Microsoft runtime
        run: |
          $vs = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -property installationPath
          $crt = Get-ChildItem "$vs/VC/Redist/MSVC/*/x64/Microsoft.VC143.CRT" -Directory | Sort-Object FullName | Select-Object -Last 1
          if (-not $crt) { throw 'Microsoft C++ runtime missing' }
          Copy-Item "$($crt.FullName)/*.dll" build/windows/x64/runner/Release/
      - name: Verify packaged release startup
        run: |
          $release = (Resolve-Path build/windows/x64/runner/Release).Path
          $process = Start-Process -FilePath "$release/Beyond.exe" -ArgumentList '--verify-startup' -WorkingDirectory $env:RUNNER_TEMP -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(30000)) { $process.Kill(); throw 'Release did not render the first Flutter frame and complete the Dart handshake' }
          if ($process.ExitCode -ne 0) { throw "Release startup failed: $($process.ExitCode)" }
          Write-Output 'Release first frame and Dart startup handshake verified'
      - uses: actions/upload-artifact@v4
        with:
          name: Beyond-Windows-dependencies
          path: desktop/pubspec.lock
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: Beyond-Windows-x64
          path: desktop/build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 14
